<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aylin’s Map Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--panel:rgba(255,255,255,.94);--chip:#ffe3a0;--s1:#7fd0ff;--s2:#eaf8ff;--red:#e8505b;--blue:#3b8df0;--green:#2fb67c;--gold:#f2a516;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f4efff;--panel:rgba(36,30,70,.94);--chip:#5a4a9c;--s1:#1f3170;--s2:#5f73c4;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f4efff;--panel:rgba(36,30,70,.94);--chip:#5a4a9c;--s1:#1f3170;--s2:#5f73c4;color-scheme:dark}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--s1),var(--s2));overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{--cl:0px;--ct:calc(env(safe-area-inset-top,0px) + 112px);--cb:calc(env(safe-area-inset-bottom,0px) + 200px);position:fixed;left:var(--cl);top:var(--ct);width:calc(100% - var(--cl));height:calc(100% - var(--ct) - var(--cb));display:block}
.p{background:var(--panel);border-radius:20px;box-shadow:0 6px 0 #0002,0 10px 24px #0003}
#top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:stretch;max-width:760px;margin:auto}
#card{flex:1;display:flex;gap:10px;align-items:center;padding:6px 14px 6px 8px;min-width:0}
#av{width:54px;height:62px;object-fit:contain;flex:none}
#q{font-size:clamp(18px,4.6vw,26px);font-weight:800;line-height:1.1}
#from,#qn{font-size:14px;font-weight:500;opacity:.8}
#side{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:6px}
.ib{border:0;border-radius:14px;background:var(--chip);color:var(--ink);font:700 20px/1 inherit;width:46px;height:42px;cursor:pointer}
#bot{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto;display:flex;flex-direction:column;gap:8px}
#dir{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;min-height:22px;font-size:15px;font-weight:700;align-items:center}
#dir i{font-style:normal;opacity:.6;font-weight:500}
.chip{background:var(--chip);padding:2px 12px;border-radius:99px;white-space:nowrap}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#pad button{border:0;border-radius:18px;color:#fff;font:800 clamp(14px,3.6vw,19px)/1.05 inherit;min-height:74px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 #0004;transition:transform .08s,box-shadow .08s}
#pad button:active{transform:translateY(5px);box-shadow:0 1px 0 #0004}
#pad span{font-size:26px}
#pad button:focus-visible,.ib:focus-visible,#ob:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
#msg{position:fixed;left:50%;top:38%;transform:translate(-50%,0);padding:10px 18px;font-weight:800;font-size:18px;text-align:center;max-width:80vw;opacity:0;pointer-events:none;transition:opacity .2s}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#150f3a99;padding:20px}
#ov .p{padding:22px 24px;max-width:420px;text-align:center}
#ov h1{margin:0 0 6px;font-size:30px;line-height:1.05}
#ov p{margin:6px 0 14px;font-size:17px;line-height:1.3}
#ob{border:0;border-radius:16px;background:var(--green);color:#fff;font:800 22px/1 inherit;padding:14px 30px;cursor:pointer;box-shadow:0 5px 0 #0004}
canvas{touch-action:none;cursor:grab}#zc{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 124px);display:flex;flex-direction:column;gap:6px;padding:6px}
@media (min-width:760px){#zc{top:calc(10px + env(safe-area-inset-top,0px))}canvas{--cl:310px;--ct:0px;--cb:0px}#top{left:10px;right:auto;width:290px;flex-direction:column;margin:0}#side{flex-direction:row;justify-content:center}#bot{left:10px;right:auto;width:290px;margin:0}#dir{flex-wrap:wrap;max-height:110px;overflow-y:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="top"><div id="card" class="p"><img id="av" alt=""><div><div id="qn"></div><div id="q"></div><div id="from"></div></div></div>
<div id="side" class="p"><button class="ib" id="hear" aria-label="Hear the question again">🔊</button><button class="ib" id="hintb" aria-label="Show hint">💡</button><button class="ib" id="redo" aria-label="Start this question again">↺</button></div></div>
<div id="msg" class="p"></div>
<div id="zc" class="p"><button class="ib" id="zi" aria-label="Zoom in">➕</button><button class="ib" id="zo" aria-label="Zoom out">➖</button><button class="ib" id="rl" aria-label="Rotate left">⟲</button><button class="ib" id="rr" aria-label="Rotate right">⟳</button><button class="ib" id="rs" aria-label="Reset view">🧭</button></div>
<div id="bot"><div id="dir" class="p"></div>
<div id="pad"><button id="bL" style="background:var(--blue)">Turn Left</button><button id="bG" style="background:var(--green)">Go Straight</button><button id="bX" style="background:var(--red)">Cross</button><button id="bR" style="background:#8a5cf0">Turn Right</button></div></div>
<div id="ov"><div class="p"><h1 id="ot"></h1><p id="otx"></p><button id="ob"></button></div></div>

{const d=D*zm;C.position.set(L.x+d*Math.cos(el)*Math.sin(az),d*Math.sin(el),L.z+d*Math.cos(el)*Math.cos(az))}C.lookAt(L);R.render(S,C);requestAnimationFrame(loop)}
